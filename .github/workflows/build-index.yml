name: Validar y regenerar índice
on:
  push:
    branches: [main]
    paths:
      - 'data/entes/**'
      - 'data/eventos/**'
      - 'data/lugares/**'
      - 'data/objetos/**'
      - 'data/mapa/**'
      - 'data/areas.json'
      - 'data/tipologia.json'
      - 'scripts/**'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar fichas
        run: python scripts/validate.py
      - name: Regenerar data/index.json
        run: python scripts/build_index.py
      - name: Regenerar siluetas del mapa
        run: |
          pip install --quiet shapely
          python scripts/build_mapa.py
      - name: Commit del índice si cambió
        run: |
          if git diff --quiet -- data/index.json data/mapa/areas.geo.json && [ -z "$(git status --porcelain -- data/iconos)" ]; then echo "Índice sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data/index.json data/mapa/areas.geo.json data/iconos
          git commit -m "Regenerar índice"
          git pull --rebase origin main
          git push
